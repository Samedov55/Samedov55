<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="White SUV driving on a night road">
  <title>On the road</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="42%"  stop-color="#E6EDF3"/>
      <stop offset="78%"  stop-color="#C3CBD4"/>
      <stop offset="100%" stop-color="#A2AAB4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#20272F"/>
      <stop offset="100%" stop-color="#10151B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F0F6FC" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#F0F6FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E6EDF3" stop-opacity=".75"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="198" rx="12"/></clipPath>

    <g id="skyline" fill="#171B21">
      <rect x="0"   y="92"  width="54" height="60"/>
      <rect x="60"  y="66"  width="38" height="86"/>
      <rect x="104" y="106" width="62" height="46"/>
      <rect x="172" y="52"  width="44" height="100"/>
      <rect x="222" y="86"  width="70" height="66"/>
      <rect x="298" y="112" width="48" height="40"/>
      <rect x="352" y="60"  width="40" height="92"/>
      <rect x="398" y="98"  width="66" height="54"/>
      <rect x="470" y="74"  width="42" height="78"/>
      <rect x="518" y="110" width="58" height="42"/>
      <rect x="582" y="58"  width="46" height="94"/>
      <rect x="634" y="96"  width="60" height="56"/>
      <rect x="700" y="80"  width="40" height="72"/>
      <rect x="746" y="108" width="70" height="44"/>
      <rect x="822" y="64"  width="44" height="88"/>
      <rect x="872" y="100" width="56" height="52"/>
      <rect x="934" y="88"  width="60" height="64"/>
    </g>

    <g id="windows" fill="#8B949E" opacity=".16">
      <rect x="70"  y="76"  width="6" height="8"/><rect x="82"  y="76"  width="6" height="8"/>
      <rect x="70"  y="92"  width="6" height="8"/><rect x="182" y="64"  width="6" height="8"/>
      <rect x="196" y="64"  width="6" height="8"/><rect x="182" y="80"  width="6" height="8"/>
      <rect x="196" y="96"  width="6" height="8"/><rect x="362" y="72"  width="6" height="8"/>
      <rect x="376" y="88"  width="6" height="8"/><rect x="480" y="86"  width="6" height="8"/>
      <rect x="494" y="102" width="6" height="8"/><rect x="592" y="70"  width="6" height="8"/>
      <rect x="606" y="70"  width="6" height="8"/><rect x="592" y="86"  width="6" height="8"/>
      <rect x="710" y="92"  width="6" height="8"/><rect x="832" y="76"  width="6" height="8"/>
      <rect x="846" y="92"  width="6" height="8"/><rect x="944" y="100" width="6" height="8"/>
    </g>
  </defs>

  <style>
    @keyframes scroll-sky  { from { transform: translateX(0);    } to { transform: translateX(-1000px); } }
    @keyframes scroll-road { from { transform: translateX(0);    } to { transform: translateX(-90px);   } }
    @keyframes spin        { from { transform: rotate(0deg);     } to { transform: rotate(360deg);      } }
    @keyframes bob         { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes glow        { 0%,100% { opacity: .62; } 50% { opacity: 1; } }
    @keyframes streak      { 0% { opacity: 0; transform: translateX(40px); } 25% { opacity: .9; } 100% { opacity: 0; transform: translateX(-90px); } }
    @keyframes twinkle     { 0%,100% { opacity: .22; } 50% { opacity: .7; } }

    .sky    { animation: scroll-sky 30s linear infinite; }
    .road   { animation: scroll-road .45s linear infinite; }
    .car    { animation: bob .9s ease-in-out infinite; }
    .wheel  { transform-box: fill-box; transform-origin: center; animation: spin .5s linear infinite; }
    .lamp   { animation: glow 2.4s ease-in-out infinite; }
    .streak { animation: streak .7s linear infinite; }
    .star   { animation: twinkle 3s ease-in-out infinite; }
  </style>

  <rect x="0" y="0" width="1000" height="200" rx="12" fill="#0D1117"/>

  <g clip-path="url(#frame)">
    <g fill="#C9D1D9">
      <circle class="star" cx="120" cy="30" r="1.4"/>
      <circle class="star" cx="300" cy="22" r="1.1" style="animation-delay:.6s"/>
      <circle class="star" cx="470" cy="38" r="1.5" style="animation-delay:1.2s"/>
      <circle class="star" cx="640" cy="26" r="1.2" style="animation-delay:.3s"/>
      <circle class="star" cx="810" cy="34" r="1.4" style="animation-delay:1.8s"/>
      <circle class="star" cx="920" cy="20" r="1.1" style="animation-delay:.9s"/>
    </g>

    <g class="sky">
      <use href="#skyline"/><use href="#skyline" x="1000"/>
      <use href="#windows"/><use href="#windows" x="1000"/>
    </g>

    <rect x="0" y="152" width="1000" height="48" fill="#0B0E13"/>
    <rect x="0" y="151" width="1000" height="1.5" fill="#30363D"/>
    <g class="road" fill="#30363D">
      <rect x="-90" y="173" width="46" height="3" rx="1.5"/><rect x="0"   y="173" width="46" height="3" rx="1.5"/>
      <rect x="90"  y="173" width="46" height="3" rx="1.5"/><rect x="180" y="173" width="46" height="3" rx="1.5"/>
      <rect x="270" y="173" width="46" height="3" rx="1.5"/><rect x="360" y="173" width="46" height="3" rx="1.5"/>
      <rect x="450" y="173" width="46" height="3" rx="1.5"/><rect x="540" y="173" width="46" height="3" rx="1.5"/>
      <rect x="630" y="173" width="46" height="3" rx="1.5"/><rect x="720" y="173" width="46" height="3" rx="1.5"/>
      <rect x="810" y="173" width="46" height="3" rx="1.5"/><rect x="900" y="173" width="46" height="3" rx="1.5"/>
      <rect x="990" y="173" width="46" height="3" rx="1.5"/>
    </g>

    <g stroke="url(#fadeR)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <line class="streak" x1="292" y1="104" x2="360" y2="104"/>
      <line class="streak" x1="278" y1="126" x2="352" y2="126" style="animation-delay:.22s"/>
      <line class="streak" x1="300" y1="146" x2="364" y2="146" style="animation-delay:.44s"/>
    </g>

    <polygon class="lamp" points="606,108 960,86 960,168 606,132" fill="url(#beam)"/>

    <ellipse cx="500" cy="153" rx="112" ry="6" fill="#E6EDF3" opacity=".12"/>

    <g transform="translate(390,72)">
      <g class="car">
        <!-- silhouette: crossover profile, front facing right -->
        <path d="M10,64 L10,38 Q10,30 18,27 L30,24 L52,6 Q56,4 64,4 L150,4 Q158,4 162,9
                 L186,27 L208,31 Q218,34 219,45 L219,58 Q219,64 213,64 L192,64
                 A24,24 0 0,0 144,64 L82,64 A24,24 0 0,0 34,64 L10,64 Z"
              fill="url(#body)" stroke="#0B0E13" stroke-width="1.2"/>

        <!-- roof rails -->
        <rect x="56" y="1.5" width="94" height="3" rx="1.5" fill="#2A3038"/>

        <!-- glazing -->
        <path d="M38,25 L57,9 L72,9 L72,25 Z"    fill="url(#glass)"/>
        <path d="M78,25 L78,9 L110,9 L110,25 Z"  fill="url(#glass)"/>
        <path d="M116,25 L116,9 L142,9 L146,25 Z" fill="url(#glass)"/>
        <path d="M152,25 L148,9 L152,9 L181,25 Z" fill="url(#glass)"/>

        <!-- black arch trim + lower cladding -->
        <path d="M192,64 A24,24 0 0,0 144,64" fill="none" stroke="#1C2128" stroke-width="5"/>
        <path d="M82,64  A24,24 0 0,0 34,64"  fill="none" stroke="#1C2128" stroke-width="5"/>
        <rect x="82"  y="56" width="62" height="8" rx="2" fill="#1C2128"/>
        <rect x="192" y="55" width="25" height="9" rx="2" fill="#1C2128"/>
        <rect x="10"  y="55" width="24" height="9" rx="2" fill="#1C2128"/>

        <!-- shut lines, handles, mirror -->
        <g stroke="#9AA4AE" stroke-width="1" opacity=".65" fill="none">
          <path d="M76,26 L76,56"/><path d="M114,26 L114,56"/><path d="M150,28 L150,55"/>
        </g>
        <rect x="88"  y="32" width="11" height="3" rx="1.5" fill="#6E7681"/>
        <rect x="126" y="32" width="11" height="3" rx="1.5" fill="#6E7681"/>
        <path d="M152,26 L161,24 L161,29 Z" fill="#1C2128"/>

        <!-- lights + grille -->
        <path class="lamp" d="M198,31 L214,33 Q219,35 217,40 L200,37 Z" fill="#F0F6FC"/>
        <rect x="199" y="44" width="18" height="8" rx="2" fill="#1C2128"/>
        <rect x="10"  y="30" width="7"  height="10" rx="2" fill="#C9D1D9" opacity=".75"/>

        <!-- wheels -->
        <circle cx="58"  cy="60" r="20"   fill="#15191F" stroke="#0B0E13" stroke-width="2"/>
        <circle cx="168" cy="60" r="20"   fill="#15191F" stroke="#0B0E13" stroke-width="2"/>
        <circle cx="58"  cy="60" r="12.5" fill="#262C34"/>
        <circle cx="168" cy="60" r="12.5" fill="#262C34"/>

        <g class="wheel" stroke="#C9D1D9" stroke-width="2.6" stroke-linecap="round">
          <circle cx="58" cy="60" r="12.5" fill="none" stroke="none"/>
          <line x1="58" y1="60" x2="69.0"  y2="60"/>
          <line x1="58" y1="60" x2="61.4"  y2="70.5"/>
          <line x1="58" y1="60" x2="49.1"  y2="66.5"/>
          <line x1="58" y1="60" x2="49.1"  y2="53.5"/>
          <line x1="58" y1="60" x2="61.4"  y2="49.5"/>
        </g>
        <g class="wheel" stroke="#C9D1D9" stroke-width="2.6" stroke-linecap="round">
          <circle cx="168" cy="60" r="12.5" fill="none" stroke="none"/>
          <line x1="168" y1="60" x2="179.0" y2="60"/>
          <line x1="168" y1="60" x2="171.4" y2="70.5"/>
          <line x1="168" y1="60" x2="159.1" y2="66.5"/>
          <line x1="168" y1="60" x2="159.1" y2="53.5"/>
          <line x1="168" y1="60" x2="171.4" y2="49.5"/>
        </g>

        <circle cx="58"  cy="60" r="3.5" fill="#E6EDF3"/>
        <circle cx="168" cy="60" r="3.5" fill="#E6EDF3"/>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="198.5" rx="12" fill="none" stroke="#30363D" stroke-width="1.5"/>
</svg>
