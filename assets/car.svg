<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="White crossover SUV driving on a night road">
  <title>On the road</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="18%"  stop-color="#F2F6F9"/>
      <stop offset="46%"  stop-color="#DCE3EA"/>
      <stop offset="72%"  stop-color="#BFC7D1"/>
      <stop offset="100%" stop-color="#98A1AC"/>
    </linearGradient>
    <linearGradient id="dlo" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#232A33"/>
      <stop offset="60%"  stop-color="#141920"/>
      <stop offset="100%" stop-color="#0C1015"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#E2E8EE"/>
      <stop offset="55%"  stop-color="#AEB7C2"/>
      <stop offset="100%" stop-color="#79828D"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F0F6FC" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#F0F6FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E6EDF3" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0%"   stop-color="#000000" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="198" rx="12"/></clipPath>

    <g id="skyline" fill="#171B21">
      <rect x="0"   y="92"  width="54" height="60"/>
      <rect x="60"  y="66"  width="38" height="86"/>
      <rect x="104" y="106" width="62" height="46"/>
      <rect x="172" y="52"  width="44" height="100"/>
      <rect x="222" y="86"  width="70" height="66"/>
      <rect x="298" y="112" width="48" height="40"/>
      <rect x="352" y="60"  width="40" height="92"/>
      <rect x="398" y="98"  width="66" height="54"/>
      <rect x="470" y="74"  width="42" height="78"/>
      <rect x="518" y="110" width="58" height="42"/>
      <rect x="582" y="58"  width="46" height="94"/>
      <rect x="634" y="96"  width="60" height="56"/>
      <rect x="700" y="80"  width="40" height="72"/>
      <rect x="746" y="108" width="70" height="44"/>
      <rect x="822" y="64"  width="44" height="88"/>
      <rect x="872" y="100" width="56" height="52"/>
      <rect x="934" y="88"  width="60" height="64"/>
    </g>

    <g id="windows" fill="#8B949E" opacity=".16">
      <rect x="70"  y="76"  width="6" height="8"/><rect x="82"  y="76"  width="6" height="8"/>
      <rect x="70"  y="92"  width="6" height="8"/><rect x="182" y="64"  width="6" height="8"/>
      <rect x="196" y="64"  width="6" height="8"/><rect x="182" y="80"  width="6" height="8"/>
      <rect x="196" y="96"  width="6" height="8"/><rect x="362" y="72"  width="6" height="8"/>
      <rect x="376" y="88"  width="6" height="8"/><rect x="480" y="86"  width="6" height="8"/>
      <rect x="494" y="102" width="6" height="8"/><rect x="592" y="70"  width="6" height="8"/>
      <rect x="606" y="70"  width="6" height="8"/><rect x="592" y="86"  width="6" height="8"/>
      <rect x="710" y="92"  width="6" height="8"/><rect x="832" y="76"  width="6" height="8"/>
      <rect x="846" y="92"  width="6" height="8"/><rect x="944" y="100" width="6" height="8"/>
    </g>

    <!-- one five-spoke alloy, drawn around the origin -->
    <g id="spokes" fill="url(#rim)">
      <polygon points="-2.4,-3.6 2.4,-3.6 4.4,-12.4 -4.4,-12.4"/>
      <polygon points="-2.4,-3.6 2.4,-3.6 4.4,-12.4 -4.4,-12.4" transform="rotate(72)"/>
      <polygon points="-2.4,-3.6 2.4,-3.6 4.4,-12.4 -4.4,-12.4" transform="rotate(144)"/>
      <polygon points="-2.4,-3.6 2.4,-3.6 4.4,-12.4 -4.4,-12.4" transform="rotate(216)"/>
      <polygon points="-2.4,-3.6 2.4,-3.6 4.4,-12.4 -4.4,-12.4" transform="rotate(288)"/>
    </g>
  </defs>

  <style>
    @keyframes scroll-sky  { from { transform: translateX(0);    } to { transform: translateX(-1000px); } }
    @keyframes scroll-road { from { transform: translateX(0);    } to { transform: translateX(-90px);   } }
    @keyframes spin        { from { transform: rotate(0deg);     } to { transform: rotate(360deg);      } }
    @keyframes bob         { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
    @keyframes glow        { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes streak      { 0% { opacity: 0; transform: translateX(40px); } 25% { opacity: .9; } 100% { opacity: 0; transform: translateX(-90px); } }
    @keyframes twinkle     { 0%,100% { opacity: .22; } 50% { opacity: .7; } }

    .sky    { animation: scroll-sky 30s linear infinite; }
    .road   { animation: scroll-road .45s linear infinite; }
    .car    { animation: bob .9s ease-in-out infinite; }
    .wheel  { transform-box: fill-box; transform-origin: center; animation: spin .5s linear infinite; }
    .lamp   { animation: glow 2.4s ease-in-out infinite; }
    .streak { animation: streak .7s linear infinite; }
    .star   { animation: twinkle 3s ease-in-out infinite; }
  </style>

  <rect x="0" y="0" width="1000" height="200" rx="12" fill="#0D1117"/>

  <g clip-path="url(#frame)">
    <g fill="#C9D1D9">
      <circle class="star" cx="120" cy="30" r="1.4"/>
      <circle class="star" cx="300" cy="22" r="1.1" style="animation-delay:.6s"/>
      <circle class="star" cx="470" cy="38" r="1.5" style="animation-delay:1.2s"/>
      <circle class="star" cx="640" cy="26" r="1.2" style="animation-delay:.3s"/>
      <circle class="star" cx="810" cy="34" r="1.4" style="animation-delay:1.8s"/>
      <circle class="star" cx="920" cy="20" r="1.1" style="animation-delay:.9s"/>
    </g>

    <g class="sky">
      <use href="#skyline"/><use href="#skyline" x="1000"/>
      <use href="#windows"/><use href="#windows" x="1000"/>
    </g>

    <rect x="0" y="152" width="1000" height="48" fill="#0B0E13"/>
    <rect x="0" y="151" width="1000" height="1.5" fill="#30363D"/>
    <g class="road" fill="#30363D">
      <rect x="-90" y="173" width="46" height="3" rx="1.5"/><rect x="0"   y="173" width="46" height="3" rx="1.5"/>
      <rect x="90"  y="173" width="46" height="3" rx="1.5"/><rect x="180" y="173" width="46" height="3" rx="1.5"/>
      <rect x="270" y="173" width="46" height="3" rx="1.5"/><rect x="360" y="173" width="46" height="3" rx="1.5"/>
      <rect x="450" y="173" width="46" height="3" rx="1.5"/><rect x="540" y="173" width="46" height="3" rx="1.5"/>
      <rect x="630" y="173" width="46" height="3" rx="1.5"/><rect x="720" y="173" width="46" height="3" rx="1.5"/>
      <rect x="810" y="173" width="46" height="3" rx="1.5"/><rect x="900" y="173" width="46" height="3" rx="1.5"/>
      <rect x="990" y="173" width="46" height="3" rx="1.5"/>
    </g>

    <g stroke="url(#fadeR)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <line class="streak" x1="288" y1="102" x2="356" y2="102"/>
      <line class="streak" x1="274" y1="124" x2="348" y2="124" style="animation-delay:.22s"/>
      <line class="streak" x1="296" y1="145" x2="360" y2="145" style="animation-delay:.44s"/>
    </g>

    <polygon class="lamp" points="614,106 962,84 962,168 614,132" fill="url(#beam)"/>

    <ellipse cx="500" cy="152" rx="112" ry="9" fill="url(#shadow)" opacity=".55"/>

    <g transform="translate(390,72)">
      <g class="car">

        <!-- underbody shadow so the car sits on the road instead of floating -->
        <path d="M68,64 L162,64 L156,74 L74,74 Z" fill="#000000" opacity=".55"/>

        <!-- ── silhouette: measured off the Tucson TL side view ──
             length 207 : height 78, hood 30% of length, wheelbase 132 -->
        <path d="M8,66 L6,49 Q6,41 10,36 L34,10 Q40,5.5 48,4 Q90,1 124,3 Q130,3.4 133,6.5
                 L149,29 L198,31 Q209,31.4 212,37 L213,48 L213,58 Q213,66 206,66 L200,66
                 A20,20 0 0,0 160,66 L68,66 A20,20 0 0,0 28,66 L8,66 Z"
              fill="url(#body)" stroke="#0B0E13" stroke-width="1.1"/>

        <!-- roof rail -->
        <path d="M54,4.6 Q92,1.6 120,3.2" fill="none" stroke="#8B949E" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>

        <!-- ── greenhouse: blacked-out pillars read as one dark mass, like the real car ── -->
        <path d="M149,29 L130,7 Q92,4 54,7 L45,25 L70,28 L112,30 Z" fill="url(#dlo)"/>
        <g stroke="#0A0D12" stroke-width="2.6" stroke-linecap="round">
          <path d="M136,9.6 L142,29.2"/>
          <path d="M104,5 L104,29.9"/>
          <path d="M70,5.5 L70,27.2"/>
        </g>
        <!-- chrome beltline trim -->
        <path d="M45,25 L70,28 L112,30 L149,29" fill="none" stroke="#C3CBD4" stroke-width="1.4" stroke-linejoin="round"/>

        <!-- ── body surfacing: shoulder highlight, crease, lower shading ── -->
        <path d="M48,28.5 L70,31 L112,33 L146,32" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".45"/>
        <path d="M200,44 L125,47.5 L24,43.5" fill="none" stroke="#000000" stroke-width="1.6" opacity=".14"/>
        <path d="M200,42.6 L125,46.1 L24,42.1" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".5"/>
        <path d="M12,45 L125,49 L202,45.5 L205,58 L18,58 Z" fill="#000000" opacity=".075"/>

        <!-- ── black cladding: arches, side skirt, bumpers ── -->
        <path d="M200,66 A20,20 0 0,0 160,66" fill="none" stroke="#242A32" stroke-width="4.8"/>
        <path d="M68,66  A20,20 0 0,0 28,66"  fill="none" stroke="#242A32" stroke-width="4.8"/>
        <path d="M69,60.5 L159,60.5 L159,66 L69,66 Z" fill="#2A3039"/>
        <path d="M200,58 L212,58 Q213,62 212,66 L206,66 L200,66 Z" fill="#242A32"/>
        <path d="M8,58 L29,58 L29,66 L9,66 Z" fill="#242A32"/>
        <rect x="194" y="61" width="15" height="3.2" rx="1.6" fill="#A2AAB4"/>
        <rect x="11"  y="61" width="16" height="3.2" rx="1.6" fill="#A2AAB4"/>

        <!-- ── doors, handles, mirror, fuel cap ── -->
        <g stroke="#8B949E" stroke-width="1" opacity=".45" fill="none">
          <path d="M152,30 L151,59"/><path d="M104,30 L104,59"/><path d="M70,27.5 L70,59"/>
        </g>
        <rect x="80"  y="38.2" width="13" height="3.2" rx="1.6" fill="#9AA4AE"/>
        <rect x="126" y="39.4" width="13" height="3.2" rx="1.6" fill="#9AA4AE"/>
        <path d="M150,29.6 L158,27.8 L158.6,30.8 L151,31.8 Z" fill="#8B949E" stroke="#0B0E13" stroke-width=".7"/>
        <circle cx="30" cy="43" r="4.4" fill="none" stroke="#8B949E" stroke-width=".9" opacity=".45"/>

        <!-- ── front end: headlight housing + lens, grille, fog lamp ── -->
        <path d="M212,36 L194,33.2 Q189,32.8 189,36.4 L190,40.6 L210,43.2 Q214,43.4 214,39.6 Z" fill="#1A1F26"/>
        <path class="lamp" d="M209.5,37.2 L195,35 Q191.5,34.7 191.5,37.2 L192.2,40 L208,42 Q211.5,42.2 211.5,39.8 Z" fill="#F0F6FC"/>
        <path d="M206,45 L213,46.5 L213,56.5 L200,55.4 Z" fill="#1A1F26"/>
        <rect x="197" y="50.4" width="6.4" height="3" rx="1.5" fill="#6E7681"/>

        <!-- ── rear: wrap-around tail lamp ── -->
        <path d="M6,30 L17,27.8 Q20,27.5 20,30 L20,36.2 Q20,38.5 17,38.8 L6,39.8 Z" fill="#8B3A3A"/>
        <path d="M8,31.6 L17,30 L17.6,35.2 L8,36.6 Z" fill="#C86B6B" opacity=".5"/>

        <!-- ── wheels: 5-spoke alloys, 225/60 R17 scale ── -->
        <g transform="translate(48,63)">
          <circle r="17"   fill="#15191F" stroke="#0B0E13" stroke-width="1.4"/>
          <circle r="12.8" fill="#1B2027"/>
          <g class="wheel">
            <circle r="12.8" fill="none" stroke="none"/>
            <use href="#spokes"/>
            <circle r="3.4" fill="#8B949E"/>
          </g>
          <circle r="12.8" fill="none" stroke="#454C55" stroke-width="1.3"/>
        </g>
        <g transform="translate(180,63)">
          <circle r="17"   fill="#15191F" stroke="#0B0E13" stroke-width="1.4"/>
          <circle r="12.8" fill="#1B2027"/>
          <g class="wheel">
            <circle r="12.8" fill="none" stroke="none"/>
            <use href="#spokes"/>
            <circle r="3.4" fill="#8B949E"/>
          </g>
          <circle r="12.8" fill="none" stroke="#454C55" stroke-width="1.3"/>
        </g>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="198.5" rx="12" fill="none" stroke="#30363D" stroke-width="1.5"/>
</svg>
